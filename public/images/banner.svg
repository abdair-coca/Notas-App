<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&amp;family=Nunito:wght@400;600;700&amp;display=swap');
      
      .title-main { font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 800; font-size: 85px; fill: #1C1C1C; }
      .title-sub { font-family: 'Nunito', system-ui, sans-serif; font-weight: 700; font-size: 22px; fill: #555555; }
      
      .card-title { font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 800; font-size: 24px; fill: #1C1C1C; }
      .card-body { font-family: 'Nunito', system-ui, sans-serif; font-weight: 600; font-size: 16px; fill: #555555; }
      .card-date { font-family: 'Nunito', system-ui, sans-serif; font-weight: 700; font-size: 12px; fill: #888888; text-transform: uppercase; letter-spacing: 0.5px;}
      
      .brutal-stroke { stroke: #1C1C1C; stroke-width: 3px; stroke-linejoin: round; stroke-linecap: round; }
      .brutal-stroke-thin { stroke: #1C1C1C; stroke-width: 2.5px; stroke-linejoin: round; }
    </style>

    <pattern id="dot-pattern" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.5" fill="#E8D5B7" />
    </pattern>

    <pattern id="card-texture" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="13" stroke="#000000" stroke-width="1" opacity="0.03" />
    </pattern>

    <path id="sparkle" d="M 20 0 Q 20 20 40 20 Q 20 20 20 40 Q 20 20 0 20 Q 20 20 20 0 Z" class="brutal-stroke" />
    
    <path id="cross" d="M 12 0 L 18 0 L 18 12 L 30 12 L 30 18 L 18 18 L 18 30 L 12 30 L 12 18 L 0 18 L 0 12 L 12 12 Z" class="brutal-stroke" />
  </defs>

  <rect width="1200" height="630" fill="#FFF8ED" />
  <rect width="1200" height="630" fill="url(#dot-pattern)" />

  <use href="#sparkle" x="120" y="100" fill="#FFD166" transform="rotate(15 140 120) scale(0.8)" />
  <use href="#sparkle" x="1050" y="450" fill="#3B82F6" transform="rotate(-10 1070 470) scale(1.2)" />
  <use href="#sparkle" x="400" y="520" fill="#FFE4F0" transform="rotate(25 420 540) scale(0.6)" />
  <use href="#cross" x="980" y="80" fill="#10B981" transform="rotate(10 995 95)" />
  <use href="#cross" x="200" y="500" fill="#F59E0B" transform="rotate(-15 215 515) scale(0.8)" />
  <circle cx="850" cy="150" r="8" fill="#1C1C1C" />
  <circle cx="300" cy="180" r="6" fill="#1C1C1C" />
  <circle cx="700" cy="550" r="10" fill="#FF6B6B" class="brutal-stroke" />

  <g transform="translate(60, 50) rotate(-6)">
    <rect x="6" y="6" width="280" height="300" rx="20" fill="#1C1C1C" />
    <rect x="0" y="0" width="280" height="300" rx="20" fill="#FFE4F0" class="brutal-stroke-thin" />
    <rect x="0" y="0" width="280" height="300" rx="20" fill="url(#card-texture)" />
    <rect x="20" y="20" width="240" height="8" rx="4" fill="#FF6B6B" opacity="0.6" />
    <text x="24" y="70" class="card-title">Diseño Creativo 🎨</text>
    <rect x="24" y="95" width="200" height="12" rx="6" fill="#1C1C1C" opacity="0.08" />
    <rect x="24" y="125" width="230" height="12" rx="6" fill="#1C1C1C" opacity="0.08" />
    <rect x="24" y="155" width="170" height="12" rx="6" fill="#1C1C1C" opacity="0.08" />
    <text x="24" y="270" class="card-date">HOY, 10:30 AM</text>
  </g>

  <g transform="translate(860, 40) rotate(5)">
    <rect x="6" y="6" width="260" height="260" rx="20" fill="#1C1C1C" />
    <rect x="0" y="0" width="260" height="260" rx="20" fill="#E0F2FE" class="brutal-stroke-thin" />
    <rect x="0" y="0" width="260" height="260" rx="20" fill="url(#card-texture)" />
    <rect x="20" y="20" width="220" height="8" rx="4" fill="#3B82F6" opacity="0.6" />
    <text x="24" y="70" class="card-title">To-Do List ✅</text>
    <circle cx="34" cy="100" r="8" fill="none" class="brutal-stroke-thin" />
    <rect x="54" y="94" width="160" height="12" rx="6" fill="#1C1C1C" opacity="0.1" />
    <circle cx="34" cy="140" r="8" fill="none" class="brutal-stroke-thin" />
    <rect x="54" y="134" width="120" height="12" rx="6" fill="#1C1C1C" opacity="0.1" />
    <circle cx="34" cy="180" r="8" fill="#1C1C1C" class="brutal-stroke-thin" />
    <rect x="54" y="174" width="140" height="12" rx="6" fill="#1C1C1C" opacity="0.1" />
  </g>

  <g transform="translate(140, 400) rotate(4)">
    <rect x="6" y="6" width="250" height="200" rx="20" fill="#1C1C1C" />
    <rect x="0" y="0" width="250" height="200" rx="20" fill="#ECFDF5" class="brutal-stroke-thin" />
    <rect x="0" y="0" width="250" height="200" rx="20" fill="url(#card-texture)" />
    <rect x="20" y="20" width="210" height="8" rx="4" fill="#34D399" opacity="0.6" />
    <text x="24" y="70" class="card-title">Organización</text>
    <rect x="24" y="100" width="190" height="45" rx="8" fill="#1C1C1C" opacity="0.05" />
    <text x="24" y="175" class="card-date">HACE 2 DÍAS</text>
  </g>

  <g transform="translate(800, 360) rotate(-3)">
    <rect x="6" y="6" width="290" height="220" rx="20" fill="#1C1C1C" />
    <rect x="0" y="0" width="290" height="220" rx="20" fill="#EDE9FE" class="brutal-stroke-thin" />
    <rect x="0" y="0" width="290" height="220" rx="20" fill="url(#card-texture)" />
    <rect x="20" y="20" width="250" height="8" rx="4" fill="#8B5CF6" opacity="0.6" />
    <text x="24" y="70" class="card-title">Ideas de Tailwind</text>
    <text x="24" y="105" class="card-body">border-2 border-[#1C1C1C]</text>
    <text x="24" y="135" class="card-body">shadow-brutal offset</text>
    <text x="24" y="165" class="card-body">font-display font-black</text>
  </g>

  <g transform="translate(320, 200)">
    <rect x="8" y="8" width="560" height="220" rx="40" fill="#1C1C1C" />
    <rect x="0" y="0" width="590" height="220" rx="40" fill="#FFD166" class="brutal-stroke" />
    
    <g transform="translate(60, 50) rotate(-8)">
      <rect x="4" y="4" width="76" height="76" rx="16" fill="#1C1C1C" />
      <rect x="0" y="0" width="76" height="76" rx="16" fill="#3B82F6" class="brutal-stroke" />
      <path d="M 22 40 L 34 50 L 56 26" fill="none" stroke="#FFF8ED" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <text x="160" y="110" class="title-main">NotasApp</text>

    <text x="60" y="175" class="title-sub">Organización y creación de notas ✦</text>
    
    <path d="M 450 160 Q 480 140 510 165" fill="none" stroke="#1C1C1C" stroke-width="3" stroke-linecap="round" />
  </g>

</svg>
